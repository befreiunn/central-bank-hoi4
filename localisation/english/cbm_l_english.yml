  cbm_debt_crisis.1.t:0 "Silent Panic in Bond Markets"
  cbm_debt_crisis.1.d:0 "Debt refinancing demand is weakening while required yields rise. We must choose our stabilization path."
  cbm_debt_crisis.1.a:0 "Seek external support package"
  cbm_debt_crisis.1.b:0 "Restructure and force domestic rollover"
  cbm_debt_crisis.2.t:0 "External Program Conditionality"
  cbm_debt_crisis.2.d:0 "Credit lines have opened, but policy conditionality is now binding."
  cbm_debt_crisis.2.a:0 "Implement fiscal and institutional benchmarks"
  cbm_debt_crisis.3.t:0 "Domestic Roll-Over Frictions"
  cbm_debt_crisis.3.d:0 "Domestic institutions absorbed debt issuance but market confidence remains fragile."
  cbm_debt_crisis.3.a:0 "Absorb the political cost"
  cbm_debt_crisis.4.t:0 "Debt Stabilization Framework"
  cbm_debt_crisis.4.d:0 "After emergency measures, a stabilization framework is now credible enough to reduce spread pressure."
  cbm_debt_crisis.4.a:0 "Lock in medium-term discipline"

  cbm_infl_spiral.1.t:0 "Inflation Spiral Warning"
  cbm_infl_spiral.1.d:0 "Prices are increasingly disconnected from policy targets. Expectations are drifting upward."
  cbm_infl_spiral.1.a:0 "Tighten policy hard"
  cbm_infl_spiral.1.b:0 "Use temporary controls and incomes policy"
  cbm_infl_spiral.2.t:0 "Disinflation Gains Credibility"
  cbm_infl_spiral.2.d:0 "Households and markets now expect lower future inflation after policy tightening."
  cbm_infl_spiral.2.a:0 "Keep a disciplined stance"
  cbm_infl_spiral.3.t:0 "Controls Lose Effectiveness"
  cbm_infl_spiral.3.d:0 "Administrative controls are no longer enough; distortions start feeding back into prices."
  cbm_infl_spiral.3.a:0 "Prepare a broader stabilization package"
  cbm_infl_spiral.4.t:0 "Expectations Re-Anchored"
  cbm_infl_spiral.4.d:0 "Policy credibility and adjustment are gradually restoring inflation expectations."
  cbm_infl_spiral.4.a:0 "Consolidate disinflation gains"

  cbm_fx_crisis.1.t:0 "Currency Stress Event"
  cbm_fx_crisis.1.d:0 "FX pressure exceeds sustainable levels and reserve adequacy is declining."
  cbm_fx_crisis.1.a:0 "Defend peg with reserves"
  cbm_fx_crisis.1.b:0 "Controlled devaluation"
  cbm_fx_crisis.2.t:0 "Reserve Drawdown Continues"
  cbm_fx_crisis.2.d:0 "The defense strategy buys time but reserve adequacy is still deteriorating."
  cbm_fx_crisis.2.a:0 "Continue intervention"
  cbm_fx_crisis.3.t:0 "Competitiveness Repricing"
  cbm_fx_crisis.3.d:0 "The exchange rate adjustment restores some competitiveness while feeding inflation."
  cbm_fx_crisis.3.a:0 "Stabilize around the new parity"
  cbm_fx_crisis.4.t:0 "FX Volatility Cools"
  cbm_fx_crisis.4.d:0 "Currency stress recedes as policy mix and market liquidity normalize."
  cbm_fx_crisis.4.a:0 "Rebuild reserve buffers"

  cbm_bank_panic.1.t:0 "Banking Panic Signal"
  cbm_bank_panic.1.d:0 "Funding fragility in the banking sector is increasing systemic risk."
  cbm_bank_panic.1.a:0 "Guarantee deposits and recapitalize"
  cbm_bank_panic.1.b:0 "Limited intervention"
  cbm_bank_panic.2.t:0 "Liquidity Backstop Stabilizes Banks"
  cbm_bank_panic.2.d:0 "Emergency support reduced immediate panic but fiscal costs remain."
  cbm_bank_panic.2.a:0 "Maintain oversight"
  cbm_bank_panic.3.t:0 "Contained Intervention Falls Short"
  cbm_bank_panic.3.d:0 "Partial response failed to stop balance-sheet deterioration across weak institutions."
  cbm_bank_panic.3.a:0 "Escalate supervision and contingency plans"
  cbm_bank_panic.4.t:0 "Banking Normalization Phase"
  cbm_bank_panic.4.d:0 "Deposit outflows slow and funding markets recover, though balance-sheet repair continues."
  cbm_bank_panic.4.a:0 "Transition to normal oversight"

